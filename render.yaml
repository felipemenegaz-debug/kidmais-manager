services:
  - type: web
    name: kidmais-manager-staging
    runtime: node
    plan: starter
    region: virginia
    branch: staging
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run check:v1:static && npm run build
    startCommand: node scripts/init-staging-data.cjs && npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: kidmais-manager-staging-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: FESTA_ENABLED
        value: "true"
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: CONTRATO_ACEITE_DEV_ENABLED
        value: "false"
      - key: KIDMAIS_DEPLOY_ENV
        value: staging
      - key: KIDMAIS_STAGING_OTP_DISABLED
        value: "SIM"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_AUTH_ORIGIN
        sync: false
      - key: ADMIN_AUTH_SECRET
        sync: false
      - key: IDENTIDADE_OTP_PEPPER
        sync: false
      - key: IDENTIDADE_OTP_PROVIDER
        value: disabled
