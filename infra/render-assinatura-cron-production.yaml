# Definição REVISÁVEL do cron de conferência de pagamentos de PRODUÇÃO (20/10/2026). NÃO é aplicada automaticamente.
# Não conectar como Blueprint nem criar o serviço sem autorização explícita de Felipe (docs/OPERACAO_AGENTES.md).
# Roteiro, lista exata de variáveis e comportamento: docs/CRON_ASSINATURA_PRODUCAO_20261020.md.
# Criação recomendada: manual no painel (New -> Cron Job) copiando estes campos. Nenhum valor secreto neste arquivo:
# as chaves `sync: false` são digitadas por Felipe no painel (copiadas do web de produção, nunca do staging).
# O código necessário para C1 (aguardando) já está na branch production (dc157a7, mesma árvore de staging aa442b7): nenhum
# deploy do web. Para C2 (conferir), a regra de alarme D-C4 ainda precisa chegar à branch production.
services:
  - type: cron
    name: kidmais-assinatura-reconciliar-production
    runtime: node
    # Mesmo plano do cron de staging (crn-db493i142hec73ahmoe0). Identificador NÃO verificado como valor de Blueprint
    # (P3-B4 da revisão de 20/10): na criação manual, escolher o tipo/custo no painel (D-C2).
    plan: 0.5c-512mb
    # Mesma região do banco kidmais-production (dpg-dak750gae00c73fudmg0-a, Virginia): a URL interna só resolve nela.
    region: virginia
    repo: https://github.com/felipemenegaz-debug/kidmais-manager
    branch: production
    autoDeployTrigger: off
    # Diário às 09:00 UTC (06:00 BRT), como no roteiro de 13/10 (P6). A regra de alarme D-C4 ancora os dias de aviso
    # nesta hora (HORA_CRON_UTC em scripts/assinatura-reconciliar.cjs; o teste amarra os dois): mudar só um desloca os avisos.
    schedule: "0 9 * * *"
    buildCommand: npm ci --include=dev && node --test scripts/assinatura-cron.test.cjs scripts/assinatura-reconciliar.test.cjs
    startCommand: node scripts/assinatura-cron.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: KIDMAIS_DEPLOY_ENV
        value: production
      # Começa em `aguardando` (no-op: sai 0 sem conectar). Só passar para `conferir` depois que o web de produção tiver
      # ASAAS_AMBIENTE=producao + chave + token (P6 etapa 4) e as mesmas três chaves forem copiadas para cá, e depois que a
      # regra de alarme D-C4 (docs/CRON_ASSINATURA_PRODUCAO_20261020.md §5a) estiver na branch production.
      - key: KIDMAIS_RECONCILIAR_MODO
        value: aguardando
      - key: KIDMAIS_RECONCILIAR_SCHEMA_VALIDADO
        value: "074-075"
      - key: KIDMAIS_RECONCILIAR_ALVO
        value: kidmais_production@dpg-dak750gae00c73fudmg0-a:5432
      - key: ASAAS_AMBIENTE
        value: producao
      # TLS igual ao web de produção (lib/db/postgres.ts): DATABASE_SSL=true obrigatório; o Postgres interno do Render usa
      # certificado autoassinado e o web de produção usa DATABASE_SSL_REJECT_UNAUTHORIZED=false. Conferir os dois no web.
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # --- Secretas: SÓ em C2 (modo conferir). Em C1 (aguardando) NÃO criar estas três chaves: o modo aguardando não as lê.
      # Por isso a criação recomendada é MANUAL; aplicado como Blueprint, o Render pediria os valores destas chaves
      # (sync: false) - deixá-las vazias/ausentes em C1. ---
      # URL INTERNA do banco kidmais_production (mesmo valor da DATABASE_URL do web, host sem domínio, sem parâmetros).
      # NUNCA definir DATABASE_URL neste cron (a reconciliação recusa quando as duas são iguais). Entra no roteiro de
      # rotação (docs/ROTACAO_CREDENCIAIS_20261007.md): a cada rotação do banco ou da chave Asaas, atualizar aqui também.
      - key: KIDMAIS_RECONCILIAR_DATABASE_URL
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
