# Blueprint separado. Não aplicar sem aprovação do serviço/custo e revisão do commit em staging.
services:
  - type: cron
    name: kidmais-assinatura-reconciliar-staging
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    repo: https://github.com/felipemenegaz-debug/kidmais-manager
    branch: staging
    autoDeployTrigger: off
    schedule: "*/5 * * * *"
    buildCommand: npm ci --include=dev && node --test scripts/assinatura-cron.test.cjs scripts/assinatura-reconciliar.test.cjs
    startCommand: node scripts/assinatura-cron.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: KIDMAIS_DEPLOY_ENV
        value: staging
      - key: ASAAS_AMBIENTE
        value: sandbox
      - key: KIDMAIS_RECONCILIAR_MODO
        value: aguardando
      - key: KIDMAIS_RECONCILIAR_SCHEMA_VALIDADO
        sync: false
      - key: KIDMAIS_RECONCILIAR_ALVO
        value: kidmais_staging_1z91@dpg-daidko3m8hqs73ce4jt0-a:5432
      - key: KIDMAIS_RECONCILIAR_DATABASE_URL
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
