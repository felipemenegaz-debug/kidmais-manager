name: CI

on:
  pull_request:
    branches: [staging, main, production]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node do projeto e cache npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Inclui testes *.test.ts de app/components/lib, ESLint, tsc --noEmit e next build.
      # Não iniciar aplicação, conectar a banco ou carregar arquivos .env neste job.
      - name: Regressão estática, lint, TypeScript e build
        run: npm run check:v1:static

      # Testes locais com ambiente sintético e mocks; não executam operação em produção.
      - name: Testes unitários dos verificadores operacionais
        run: npm run production:test

      - name: Testes unitários do bloqueio de OTP
        run: node --test scripts/otp-staging.test.cjs

      # Sem banco e sem rede: executor do reparo com cliente simulado, blocos de Shell executados com bash (e bash -i,
      # pulado com motivo se indisponível) em pastas temporárias, e o cron de produção recusando antes de conectar.
      - name: Testes do reparo de bloqueios e do cron de conferência (produção)
        run: >-
          node --test
          scripts/reparo-bloqueios-producao-20261020.test.cjs
          scripts/bloco-shell-reparo-bloqueios-producao-20261020.test.cjs
          scripts/assinatura-cron-producao-20261020.test.cjs
          scripts/assinatura-cron.test.cjs
          scripts/assinatura-renovacao-cron.test.cjs
          scripts/assinatura-reconciliar.test.cjs
          scripts/assinatura-reconciliar-preservacao.test.cjs
          scripts/recuperacao-pagamentos-producao.test.cjs
          scripts/bloco-shell-recuperacao-b14.test.cjs
          scripts/recuperacao-neutras-b14.test.cjs
          scripts/reparo-bloqueios-production.test.cjs

      # Sem rede (fetch global bloqueado; transporte real do produto com rede simulada) e sem /opt: guarda de serviço, env do
      # e-mail, flags da venda, envio único sem retentativa, anti-replay, sigilo da chave e blocos de Shell executados com
      # bash (e bash -i, pulado com motivo se indisponível) em pastas temporárias.
      - name: Prova de entrega de e-mail em produção (V6) — executor e blocos de Shell
        run: >-
          node --test
          scripts/email-producao-20261020.test.cjs
          scripts/bloco-shell-email-producao-20261020.test.cjs

      - name: Serviço de convites — cotas, idempotência e acesso com dependências simuladas
        run: node --test lib/convites/service.test.cjs lib/convites/biblioteca.test.cjs scripts/migration-099-staging.test.cjs

      - name: Convites — migration 084, decisão só do operador e fila do painel (dependências simuladas)
        run: node --test lib/convites/recuperacao.test.cjs lib/desenvolvedor/convites-geracoes.test.cjs

      - name: Convites — download da arte completa preserva dimensões, sem recorte ou textos sobrepostos
        run: node --test scripts/convites-exportacao-completa.test.cjs

      - name: Aplicador manual da 083 em staging — alvo, hashes, privilégio de DDL e tentativa única (cliente simulado)
        run: node --test scripts/migration-083-staging.test.cjs

      - name: Aplicador manual da 084 em staging — alvo, hashes, privilégio de DDL, estados preservados e tentativa única (cliente simulado)
        run: node --test scripts/migration-084-staging.test.cjs

      - name: Aplicador manual da 085/086 (Marketing) em staging — plano sem conexão, alvo, hashes, pré-requisitos 083/084, estado parcial, privilégios, trava concorrente, retomada e sigilo (cliente simulado)
        run: node --test scripts/migration-085-086-staging.test.cjs

      - name: Blocos de Shell da 6b (085/086) — dependências e conteúdo conferidos por sha, sem sobrescrever, limpeza seletiva, guarda de serviço, subshell e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-085-086-staging.test.cjs

      - name: Aplicador manual da 079 em produção — trava de alvo e anti-repetição (cliente simulado)
        run: node --test scripts/migration-079-production.test.cjs

      - name: Aplicador manual da 084 em produção — trava de alvo, TLS, hashes, privilégio, estados preservados e anti-repetição (cliente simulado)
        run: node --test scripts/migration-084-production.test.cjs

      - name: Aplicadores manuais da 088 (staging e produção) — trava de alvo, identidade, hashes, plano, privilégios CREATE/REFERENCES, conferência só leitura, backup obrigatório e anti-repetição (cliente simulado)
        run: node --test scripts/migration-088.test.cjs

      - name: Blocos de Shell da 088 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-088.test.cjs

      - name: Aplicadores manuais da 089 (cancelamento e devolução) — trava de alvo, identidade, hashes, plano, privilégios CREATE/REFERENCES, conferência só leitura, backup obrigatório e anti-repetição (cliente simulado)
        run: node --test scripts/migration-089.test.cjs

      - name: Blocos de Shell da 089 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-089.test.cjs

      - name: Aplicador manual da 092–094 (agenda e preços, staging) — trava de alvo, identidade, hashes, estado por migration, ordem, dependências e privilégios CREATE/DONO/REFERENCES, conferência só leitura, backup obrigatório, falha no meio e anti-repetição (cliente simulado)
        run: node --test scripts/migration-092-094.test.cjs

      - name: Blocos de Shell da 092–094 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-092-094.test.cjs

      - name: Aplicadores manuais da 095 (créditos de IA, staging e produção) — trava de alvo, identidade, hashes, plano, privilégios CREATE/REFERENCES, conferência só leitura, backup obrigatório e anti-repetição (cliente simulado)
        run: node --test scripts/migration-095.test.cjs

      - name: Blocos de Shell da 095 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-095.test.cjs

      - name: Aplicador manual da 098 (salão combinado, staging) — trava de alvo, identidade, hashes, retrato somente leitura (094/098 e tipos divergentes), estado e privilégios CREATE/DONO, conferência só leitura, backup obrigatório, COMMIT confirmado/desfeito/indeterminado, prova de preservação e anti-repetição (cliente simulado)
        run: node --test scripts/migration-098.test.cjs

      - name: Blocos de Shell da 098 (RETRATO, CONFERIR, APLICAR) — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-098.test.cjs

      - name: Aplicador manual da 100 (agenda com um salão, staging) — trava de alvo, identidade, hashes, estado pelo corpo da regra de conflito (094/100/divergente), dono, inventário de pares no mesmo horário relido antes de aplicar, conferência só leitura, backup obrigatório, COMMIT confirmado/desfeito/indeterminado, validação composta e anti-repetição (cliente simulado)
        run: node --test scripts/migration-100.test.cjs

      - name: Blocos de Shell da 100 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-100.test.cjs

      - name: Aplicador manual da 102/103 (apresentação do salão e categoria Serviços, staging) — trava de alvo, identidade, hashes, estado por migration (102 ausente/completa/parcial, 103 ausente/completa/divergente), 098, versão do PostgreSQL do retrato, privilégios, conferência só leitura, backup obrigatório, COMMIT confirmado/desfeito/indeterminado por migration e anti-repetição (cliente simulado)
        run: node --test scripts/migration-102-103.test.cjs

      - name: Blocos de Shell da 102/103 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-102-103.test.cjs

      # Aplicador da 105 (canal MCP, staging): cliente simulado, sem banco nem rede.
      - name: Aplicador da 105 (staging) — cliente simulado
        run: node --test scripts/migration-105.test.cjs

      # Blocos de Shell da 105: colagem real em bash e bash -i num destino temporário; não toca banco nem /opt/render.
      - name: Blocos de Shell da 105 (staging)
        run: node --test scripts/bloco-shell-105.test.cjs

      # Aplicador da 105 de PRODUÇÃO (plano MCP produção, P1): transação única, integridade por definições com mutantes,
      # PITR como gate, marcador com o COMMIT em memória e ENOSPC; cliente simulado, sem banco nem rede.
      - name: Aplicador da 105 (production) — cliente simulado
        run: node --test scripts/migration-105-production.test.cjs

      - name: Blocos de Shell da 105 (production)
        run: node --test scripts/bloco-shell-105-production.test.cjs

      - name: Aplicador manual da 104/106 (hash da revisão com o salão e salão de preferência, staging) — trava de alvo, identidade, hashes, moldura de uma transação, estados com precedência (104 divergente/parcial, presença × integridade), privilégios por etapa de current_user, atividade pelas pg_locks com contexto, verificações DO e EXECUTE antes do COMMIT, COMMIT confirmado/desfeito/indeterminado por migration, auditoria de dados separada e anti-repetição (cliente simulado)
        run: node --test scripts/migration-104-106.test.cjs

      - name: Blocos de Shell da 104/106 — arquivos implantados conferidos por sha, guarda de serviço, subshell, backup obrigatório, aplicador real recusando antes de conectar e colagem interativa (bash e bash -i em diretório temporário)
        run: node --test scripts/bloco-shell-104-106.test.cjs
